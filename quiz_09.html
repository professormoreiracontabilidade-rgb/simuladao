<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 09</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 81, "q": "É exemplo de despesa de capital:", "a": ["Diárias", "Material de consumo", "Salários", "Construção de obras", "Juros da dívida"], "k": 3, "e": "A execução de obras integra investimentos, que são grupo de natureza da despesa de capital. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 82, "q": "Na sequência didática dos estágios da receita, após a arrecadação ocorre o:", "a": ["Liquidação", "Fixação", "Pagamento", "Empenho", "Recolhimento"], "k": 4, "e": "A sequência clássica é previsão, lançamento (quando cabível), arrecadação e recolhimento. Nem toda receita passa por lançamento. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 83, "q": "Na sequência didática dos estágios da despesa, após a liquidação ocorre:", "a": ["Previsão", "Recolhimento", "Pagamento", "Arrecadação", "Lançamento"], "k": 2, "e": "A execução orçamentária envolve empenho, liquidação e pagamento. A fixação é etapa de planejamento e autorização orçamentária. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 84, "q": "Na execução da despesa orçamentária, o empenho é:", "a": ["Ato que cria para o Estado obrigação de pagamento, pendente ou não de condição", "Previsão", "Liquidação", "Arrecadação", "Pagamento efetivo"], "k": 0, "e": "O empenho é ato de autoridade competente que cria para o Estado obrigação de pagamento pendente ou não de implemento de condição (Lei 4.320/1964, art. 58). Também compromete a dotação orçamentária, mas não se confunde com a liquidação, que verifica o direito adquirido pelo credor, nem com o pagamento."}, {"n": 85, "q": "Liquidação da despesa é:", "a": ["Previsão", "Empenho", "Pagamento", "Verificação do direito adquirido pelo credor", "Arrecadação"], "k": 3, "e": "A liquidação verifica origem, objeto, importância e credor, com base em títulos e documentos comprobatórios, antes do pagamento. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 86, "q": "Crédito adicional suplementar destina-se a:", "a": ["Eliminar orçamento", "Somente guerra", "Somente calamidade", "Criar despesa sem dotação", "Reforçar dotação existente"], "k": 4, "e": "O crédito suplementar reforça dotação orçamentária já prevista na LOA, exigindo autorização e abertura na forma legal. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 87, "q": "Crédito adicional especial destina-se a:", "a": ["Somente calamidade", "Reforçar dotação existente", "Somente guerra", "Despesa sem dotação orçamentária específica", "Cancelar empenho"], "k": 3, "e": "Crédito especial autoriza despesa para a qual não havia dotação específica no orçamento. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 88, "q": "Crédito extraordinário é destinado a despesas:", "a": ["Rotineiras", "De custeio ordinário", "Com dotação suficiente", "Sempre previstas", "Urgentes e imprevisíveis, como guerra ou calamidade"], "k": 4, "e": "A Constituição prevê créditos extraordinários para despesas imprevisíveis e urgentes, exemplificadas por guerra, comoção interna e calamidade pública."}, {"n": 89, "q": "Restos a pagar processados são despesas:", "a": ["Empenhadas e liquidadas, mas não pagas", "Já pagas", "Empenhadas e não liquidadas", "Sem empenho", "Canceladas"], "k": 0, "e": "O credor já teve seu direito verificado na liquidação; faltou o pagamento até o encerramento do exercício. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 90, "q": "Restos a pagar não processados são despesas:", "a": ["Pagas sem empenho", "Somente previstas", "Liquidadas e pagas", "Empenhadas, mas não liquidadas", "Canceladas"], "k": 3, "e": "O empenho foi realizado, mas a liquidação ainda não se completou até o fim do exercício. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}];const TITLE="CONTABILIDADE PÚBLICA E AFO";const QUIZ="20_9";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
