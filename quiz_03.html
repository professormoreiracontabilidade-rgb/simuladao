<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 03</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 21, "q": "Com AC de R$ 50.000 e PC de R$ 25.000, a liquidez corrente é:", "a": ["0,5", "3,0", "2,0", "1,0", "0,2"], "k": 2, "e": "Liquidez corrente = ativo circulante / passivo circulante = 50.000 / 25.000 = 2. Em termos contábeis, há R$ 2 em ativos circulantes por R$ 1 de passivos circulantes."}, {"n": 22, "q": "Na fórmula simplificada, a liquidez seca exclui do ativo circulante os:", "a": ["Clientes", "Valores em caixa", "Aplicações financeiras", "Estoques", "Saldos bancários"], "k": 3, "e": "Liquidez seca = (AC − estoques) / PC na versão simplificada. Alguns modelos também ajustam despesas antecipadas e outros itens menos líquidos; observe a fórmula da banca."}, {"n": 23, "q": "Receita líquida de R$ 200.000 e ativo total de R$ 100.000 produzem giro do ativo de:", "a": ["1,0", "0,5", "4,0", "3,0", "2,0"], "k": 4, "e": "Giro do ativo = receita líquida / ativo total = 200.000 / 100.000 = 2 vezes. Para análises completas, é comum utilizar ativo médio. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 24, "q": "Lucro líquido de R$ 20.000 e PL de R$ 100.000 produzem ROE de:", "a": ["20%", "5%", "30%", "10%", "50%"], "k": 0, "e": "ROE = lucro líquido / patrimônio líquido = 20.000 / 100.000 = 20%. Na prática, pode-se utilizar PL médio para refletir melhor o período."}, {"n": 25, "q": "Lucro líquido de R$ 15.000 e receita líquida de R$ 150.000 produzem margem líquida de:", "a": ["10%", "5%", "20%", "15%", "30%"], "k": 0, "e": "Margem líquida = lucro líquido / receita líquida = 15.000 / 150.000 = 10%. A cada R$ 100 de vendas líquidas, sobram R$ 10 de lucro líquido."}, {"n": 26, "q": "No indicador de endividamento geral, definido nesta questão como (passivo exigível total)/(ativo total), um aumento indica:", "a": ["Menor dependência de terceiros", "Menor risco sempre", "Maior dependência de terceiros", "Maior lucro necessariamente", "Maior liquidez necessariamente"], "k": 2, "e": "O passivo exigível total corresponde às obrigações com terceiros (circulante e não circulante), e não inclui o patrimônio líquido. Quanto maior sua participação no ativo, maior o financiamento por capital de terceiros. Outros índices usam definições distintas, por isso é essencial explicitar a fórmula."}, {"n": 27, "q": "A análise horizontal compara:", "a": ["A mesma conta ao longo de períodos", "Somente orçamento e realizado", "Somente empresas diferentes", "Ativo e passivo no mesmo dia", "Contas entre si no mesmo período"], "k": 0, "e": "A análise horizontal mede evolução temporal de saldos ou resultados, em valores absolutos ou percentuais, tomando um período-base ou anterior como referência."}, {"n": 28, "q": "A análise vertical mede:", "a": ["Variação entre anos", "Somente lucro líquido", "Somente orçamento", "Somente fluxo de caixa", "Participação de uma conta em um total do mesmo período"], "k": 4, "e": "Na análise vertical, cada rubrica é expressa como percentual de uma base: ativo total no balanço ou receita líquida na DRE, por exemplo."}, {"n": 29, "q": "Se AC = R$ 80.000 e PC = R$ 30.000, o capital circulante líquido é:", "a": ["R$ 50.000", "R$ 80.000", "R$ 110.000", "R$ 10.000", "R$ 30.000"], "k": 0, "e": "CCL = AC − PC = 80.000 − 30.000 = R$ 50.000. O indicador expressa a folga de recursos circulantes em relação às obrigações de curto prazo."}, {"n": 30, "q": "Mantidas as demais condições, o reconhecimento de prejuízo no período:", "a": ["Gera receita", "Não altera o PL", "Transforma o PL em ativo", "Reduz o PL", "Aumenta o PL"], "k": 3, "e": "O prejuízo diminui o patrimônio líquido, pois representa redução residual do interesse dos proprietários, ressalvados outros movimentos patrimoniais simultâneos."}];const TITLE="CONTABILIDADE GERAL E ANÁLISE";const QUIZ="20_3";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
