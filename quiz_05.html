<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 05</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 41, "q": "O ponto de equilíbrio econômico acrescenta ao numerador:", "a": ["Somente custos variáveis", "Nenhum valor", "Lucro desejado ou custo de oportunidade", "Somente estoque", "Depreciação em dobro"], "k": 2, "e": "PE econômico = (gastos fixos + lucro-alvo) / MCunit. O lucro-alvo pode refletir a remuneração mínima desejada do capital. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 42, "q": "O ponto de equilíbrio financeiro desconsidera, entre os gastos fixos, os:", "a": ["Gastos fixos desembolsáveis", "Preços de venda", "Gastos sem desembolso, como depreciação", "Custos variáveis desembolsáveis", "Valores de MC"], "k": 2, "e": "O PE financeiro foca saídas de caixa, retirando despesas não desembolsáveis. Também pode considerar pagamentos financeiros não incluídos no resultado, conforme o modelo."}, {"n": 43, "q": "Margem de segurança mostra:", "a": ["Quanto as vendas podem cair antes do ponto de equilíbrio", "Receita bruta", "Lucro máximo", "Prejuízo acumulado", "Custo total"], "k": 0, "e": "Margem de segurança = vendas efetivas − vendas no ponto de equilíbrio. Pode ser calculada em unidades, reais ou percentual. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 44, "q": "Custo de oportunidade representa:", "a": ["Perda por acidente", "Custo histórico", "Despesa contabilizada sempre", "Benefício da melhor alternativa sacrificada", "Custo fixo obrigatório"], "k": 3, "e": "É o retorno de que se abre mão ao escolher uma alternativa. Relevante para decisões, embora nem sempre registrado contabilmente. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 45, "q": "Custo-padrão é:", "a": ["Custo variável", "Perda", "Custo predeterminado usado como referência", "Custo fixo", "Sempre o custo realizado"], "k": 2, "e": "O custo-padrão é parâmetro para planejamento e controle. A comparação com o realizado permite investigar variações de preço, eficiência e quantidade."}, {"n": 46, "q": "Uma variação de custo é favorável quando, mantidas as demais condições:", "a": ["Sempre ocorre", "Real iguala padrão", "Nunca ocorre", "Real excede padrão", "Real fica abaixo do padrão"], "k": 4, "e": "Se o custo real é menor que o padrão, há economia favorável. A análise deve investigar qualidade, volume e outras causas antes de concluir que o desempenho foi melhor."}, {"n": 47, "q": "O rateio é especialmente usado para distribuir:", "a": ["Capital social", "Receitas de venda", "Lucro líquido", "Custos indiretos", "Custos diretos rastreáveis"], "k": 3, "e": "Custos indiretos não são atribuídos diretamente ao produto. Precisam de bases de rateio razoáveis, como horas-máquina ou mão de obra. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 48, "q": "Custo primário corresponde a matéria-prima direta mais mão de obra:", "a": ["Fixa", "Direta", "Total da empresa", "Indireta", "Variável apenas"], "k": 1, "e": "Custo primário = materiais diretos + mão de obra direta. Não inclui os demais custos indiretos de fabricação. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 49, "q": "Na expressão MOD + CIF, CIF significa:", "a": ["Custos fixos", "Custos indiretos de fabricação", "Custos diretos", "Custos variáveis", "Custos totais"], "k": 1, "e": "O custo de transformação é a soma da mão de obra direta com os custos indiretos de fabricação. A matéria-prima direta não entra nessa soma."}, {"n": 50, "q": "CF total de R$ 20.000 para 1.000 unidades resulta em CF unitário de:", "a": ["R$ 30", "R$ 20", "R$ 50", "R$ 40", "R$ 10"], "k": 1, "e": "Custo fixo unitário = 20.000 / 1.000 = R$ 20 por unidade. É uma alocação do custo total ao volume produzido. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}];const TITLE="CUSTOS E GERENCIAL";const QUIZ="20_5";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
