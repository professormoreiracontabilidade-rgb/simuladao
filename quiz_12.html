<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 12</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 111, "q": "A auditoria interna é exercida, em regra, por:", "a": ["Profissional independente que opina nas demonstrações", "Juiz nomeado", "Empregado da entidade, como exemplo típico", "Perito judicial", "Fiscal tributário"], "k": 2, "e": "A auditoria interna é atividade de avaliação e consultoria que integra a estrutura de governança e controles da entidade. Pode ser executada por empregados ou por profissionais contratados/terceirizados; o elemento decisivo não é o vínculo empregatício, mas a função exercida. Entre as opções, empregado da entidade é o exemplo típico."}, {"n": 112, "q": "A auditoria externa de demonstrações contábeis é realizada por:", "a": ["Gerente de vendas", "Auditor independente", "Juiz", "Controller", "Empregado responsável pelos lançamentos"], "k": 1, "e": "O auditor independente deve atender aos requisitos de independência e ética para expressar opinião sobre demonstrações contábeis. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 113, "q": "O objetivo central da auditoria independente de demonstrações é:", "a": ["Obter segurança razoável e emitir opinião sobre as demonstrações", "Gerenciar a empresa", "Recolher impostos", "Detectar todas as fraudes", "Preparar a contabilidade"], "k": 0, "e": "Pela NBC TA 200, busca-se segurança razoável de que as demonstrações estão livres de distorção relevante, por fraude ou erro, para fundamentar a opinião."}, {"n": 114, "q": "A segurança obtida em auditoria independente é:", "a": ["Absoluta", "Garantida integralmente", "Razoável, mas não absoluta", "Inexistente", "Zero"], "k": 2, "e": "Limitações inerentes, como amostragem, julgamento e natureza das evidências, impedem segurança absoluta. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 115, "q": "No modelo de risco de auditoria, RA = RI × RC ×:", "a": ["RM", "RA novamente", "RT", "RD, risco de detecção", "RF"], "k": 3, "e": "O risco de auditoria combina risco inerente, risco de controle e risco de detecção. Os dois primeiros formam o risco de distorção relevante."}, {"n": 116, "q": "Informação é material quando sua omissão ou distorção pode:", "a": ["Ser irrelevante sempre", "Ser sempre zero", "Influenciar decisões dos usuários", "Equivaler ao ativo total", "Ser negativa"], "k": 2, "e": "Materialidade depende de natureza e magnitude no contexto. Não há percentual único válido para todas as auditorias. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 117, "q": "Evidência de auditoria precisa ser:", "a": ["Suficiente e apropriada", "Apenas escrita", "Escassa", "Apenas oral", "Irrelevante"], "k": 0, "e": "Suficiência diz respeito à quantidade; adequação, à qualidade, relevância e confiabilidade. Mais evidência ruim não substitui evidência apropriada."}, {"n": 118, "q": "Teste de controles busca avaliar:", "a": ["Somente saldos", "Somente receita", "Somente lucro", "Somente fraude", "Eficácia operacional dos controles"], "k": 4, "e": "Os testes de controles avaliam se controles relevantes funcionaram efetivamente durante o período examinado. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 119, "q": "Procedimentos substantivos destinam-se a:", "a": ["Substituir todo planejamento", "Somente testar controles", "Detectar distorções relevantes em classes, saldos e divulgações", "Avaliar somente RH", "Definir governança"], "k": 2, "e": "Procedimentos substantivos abrangem testes de detalhes e procedimentos analíticos substantivos, para obter evidência sobre afirmações contábeis."}, {"n": 120, "q": "Opinião não modificada significa que o auditor concluiu que:", "a": ["Todos os controles são perfeitos", "Não existe risco", "Não houve auditoria", "As demonstrações foram elaboradas adequadamente, em todos os aspectos relevantes", "Há distorção generalizada"], "k": 3, "e": "A opinião não modificada não garante ausência de qualquer erro, mas indica apresentação adequada, em todos os aspectos relevantes, conforme a estrutura aplicável."}];const TITLE="AUDITORIA E PERÍCIA";const QUIZ="20_12";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
