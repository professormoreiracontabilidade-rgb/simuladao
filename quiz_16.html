<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 16</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 151, "q": "Tributo, nos termos do CTN, é prestação:", "a": ["Pecuniária compulsória, instituída em lei e que não constitui sanção de ato ilícito", "Punitiva por infração", "Doada", "Condominial privada", "Voluntária"], "k": 0, "e": "O art. 3º do CTN define tributo como prestação pecuniária compulsória, em moeda ou valor nela exprimível, que não constitui sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa vinculada."}, {"n": 152, "q": "Imposto é tributo cujo fato gerador independe de:", "a": ["Base de cálculo", "Obrigação tributária", "Lei", "Fato gerador", "Atividade estatal específica relativa ao contribuinte"], "k": 4, "e": "Pelo art. 16 do CTN, o imposto não depende de serviço público específico prestado ao contribuinte, diferentemente das taxas. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 153, "q": "Taxa pode decorrer de:", "a": ["Renda auferida", "Lucro", "Patrimônio por si só", "Venda de mercadorias por si só", "Poder de polícia ou serviço público específico e divisível"], "k": 4, "e": "O art. 77 do CTN admite taxas pelo exercício regular do poder de polícia ou utilização efetiva ou potencial de serviço público específico e divisível."}, {"n": 154, "q": "Contribuição de melhoria relaciona-se a:", "a": ["Valorização imobiliária decorrente de obra pública", "Venda", "Renda", "Lucro", "Serviço privado"], "k": 0, "e": "A contribuição de melhoria pode ser instituída em razão de obra pública que valorize imóveis, observados limites e requisitos legais. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 155, "q": "Como regra, instituir ou majorar tributo exige:", "a": ["Portaria", "Medida provisória em qualquer situação", "Decreto simples", "Lei", "Resolução administrativa"], "k": 3, "e": "A legalidade tributária exige lei para instituir ou aumentar tributos, ressalvadas exceções constitucionais quanto à alteração de alíquotas e outras particularidades."}, {"n": 156, "q": "Como regra geral, respeitadas as exceções constitucionais, o princípio da anterioridade anual impede a cobrança de tributo no mesmo exercício financeiro da publicação da lei que o instituiu ou aumentou. A cobrança fica para:", "a": ["Décimo ano", "Exercício seguinte", "Mesmo exercício financeiro da publicação da lei instituidora ou majoradora", "Quinto ano", "Ano posterior ao seguinte"], "k": 2, "e": "A anterioridade anual, art. 150, III, b, da CF, veda em regra a cobrança no mesmo exercício da publicação da lei. Há exceções constitucionais, e diversos tributos também se submetem à anterioridade nonagesimal (90 dias), cumulativamente ou conforme exceções específicas."}, {"n": 157, "q": "A irretroatividade tributária veda, em regra, cobrança sobre:", "a": ["Fatos geradores anteriores à vigência da lei instituidora ou majoradora", "Fatos posteriores", "Qualquer fato", "Fatos futuros", "Fatos ainda não ocorridos"], "k": 0, "e": "A Constituição protege fatos geradores anteriores à vigência da lei que institui ou majora tributos, ressalvadas hipóteses legais específicas de retroatividade benigna ou interpretativa."}, {"n": 158, "q": "Segundo o CTN, a competência tributária para instituir tributos é, em regra:", "a": ["Exclusiva dos municípios", "Sempre privativa da União", "Livremente transferível", "Indelegável, conforme o CTN", "Delegável por contrato"], "k": 3, "e": "O art. 7º do CTN estabelece que a competência tributária é indelegável. A capacidade tributária ativa, relativa a funções de arrecadação/fiscalização e execução de leis, pode ser atribuída a outra pessoa jurídica de direito público nos termos legais. A palavra privativa não descreve todas as competências, pois há competências comuns e outras repartições constitucionais."}, {"n": 159, "q": "Qual imposto tradicionalmente NÃO é de competência da União?", "a": ["ICMS", "Imposto de Importação", "IR", "IPI", "IOF"], "k": 0, "e": "O ICMS é imposto estadual e distrital. Atenção à transição da reforma tributária: o IBS substituirá gradualmente ICMS e ISS, segundo calendário constitucional."}, {"n": 160, "q": "Entre os impostos abaixo, é de competência estadual:", "a": ["ITBI", "IPTU", "IOF", "ISS", "ICMS"], "k": 4, "e": "O ICMS pertence aos estados e ao Distrito Federal, com substituição gradual pelo IBS na reforma tributária. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}];const TITLE="TRIBUTÁRIO E REVISÃO";const QUIZ="20_16";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
