<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>Professor Moreira — Quiz 18</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2549b8,transparent 45%),linear-gradient(135deg,#070d45,#17127c 65%,#27136b);color:white;font:600 clamp(17px,2.8vw,23px)/1.45 system-ui,Arial}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;color:#ffe43d;font-weight:1000;font-size:clamp(16px,3vw,24px);letter-spacing:.4px}.panel{background:#101c73;border:3px solid #ffd831;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 35px #0006;flex:1}.eyebrow{color:#ffdd2f;font-size:.8em;font-weight:900}.question{font-size:clamp(23px,4.5vw,35px);line-height:1.25;font-weight:900;margin:14px 0 24px}.choice{width:100%;display:block;text-align:left;background:#fff;color:#10124b;border:3px solid transparent;border-radius:16px;margin:9px 0;padding:13px 16px;font:800 clamp(17px,2.8vw,22px)/1.3 system-ui;cursor:pointer}.choice:disabled{opacity:1;cursor:default}.choice.correct{background:#0d9d49;color:#fff;border-color:#b3ffc7}.choice.wrong{background:#d92c3c;color:#fff;border-color:#ffc5c5}.choice b{color:#f1ae00;margin-right:9px}.choice.correct b,.choice.wrong b{color:white}.explain{background:#fff9d5;color:#142059;border-left:8px solid #ffbf00;padding:18px;border-radius:15px;margin-top:22px;font-weight:600}.explain strong{color:#0b2874}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button,.go{border:0;border-radius:14px;padding:12px 18px;background:#ffdd32;color:#0a185b;font:900 17px system-ui;cursor:pointer}.controls button:disabled{opacity:.4}.meter{height:12px;background:#364593;border-radius:15px;overflow:hidden}.meter div{height:100%;background:#ffda2d;transition:width .2s}.score{font-size:clamp(28px,6vw,50px);font-weight:1000;color:#ffdc2f;text-align:center}.small{font-size:15px;color:#cbd6ff;text-align:center}.cover{text-align:center;display:grid;place-content:center;min-height:60vh;gap:20px}.cover h1{font-size:clamp(32px,6vw,54px);line-height:1.12;color:#ffdc2f;margin:0}.cover h2{font-size:clamp(21px,4vw,30px);margin:0}.go{display:inline-block;text-decoration:none}.toplink{color:#fff;text-align:center;font-size:15px}.flash{animation:flash .5s 2}@keyframes flash{50%{box-shadow:inset 0 0 0 10px #19ff7a}}.flash.bad{animation-name:bad}@keyframes bad{50%{box-shadow:inset 0 0 0 10px #ff455a}}</style></head><body><main id="app"></main><script>const DATA=[{"n": 171, "q": "Isenção tributária é:", "a": ["Moratória", "Perdão automático de multa", "Dispensa legal do tributo nas condições previstas", "Parcelamento", "Pagamento"], "k": 2, "e": "A isenção decorre de lei e afasta o crédito tributário nas condições previstas, sem se confundir com imunidade constitucional. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}, {"n": 172, "q": "Anistia tributária refere-se a:", "a": ["Competência tributária", "Base de cálculo", "Tributo principal", "Alíquota", "Penalidades por infrações abrangidas pela lei"], "k": 4, "e": "A anistia, conforme CTN, alcança infrações tributárias e respectivas penalidades nas condições legais, não sendo sinônimo de remissão do tributo."}, {"n": 173, "q": "Remissão tributária é:", "a": ["Apenas perdão de multa futura", "Nova base", "Nova alíquota", "Parcelamento", "Perdão total ou parcial do crédito tributário"], "k": 4, "e": "Remissão é causa de extinção do crédito tributário concedida nos termos da lei; pode abranger parcelas do crédito, inclusive acréscimos conforme previsão legal."}, {"n": 174, "q": "Prescrição tributária, em regra, refere-se ao prazo de:", "a": ["5 anos para lançar sempre", "5 anos para a ação de cobrança do crédito definitivamente constituído", "90 dias para anistiar", "10 anos para isentar", "1 ano para pagar"], "k": 1, "e": "Pelo CTN art. 174, a ação para cobrança prescreve em cinco anos contados da constituição definitiva do crédito, observadas causas interruptivas e suspensivas."}, {"n": 175, "q": "Decadência tributária refere-se, em regra, ao prazo para:", "a": ["Cobrar judicialmente", "Isentar", "Pagar", "Constituir o crédito por lançamento, em regra cinco anos", "Anistiar"], "k": 3, "e": "A decadência limita o direito de lançar. O termo inicial depende da modalidade de lançamento e das circunstâncias, conforme CTN arts. 150 §4º e 173."}, {"n": 176, "q": "Sujeito ativo da obrigação tributária é:", "a": ["Responsável tributário", "Contador", "Advogado", "Contribuinte", "Pessoa jurídica de direito público titular da exigência"], "k": 4, "e": "O CTN art. 119 define sujeito ativo como pessoa jurídica de direito público titular da competência para exigir o cumprimento da obrigação."}, {"n": 177, "q": "Sujeito passivo da obrigação tributária principal é:", "a": ["Contribuinte ou responsável obrigado ao pagamento", "Somente União", "Ente cobrador", "Juiz", "Somente município"], "k": 0, "e": "O sujeito passivo deve cumprir a obrigação pecuniária, seja contribuinte com relação pessoal e direta, seja responsável por determinação legal."}, {"n": 178, "q": "Obrigação tributária principal tem por objeto:", "a": ["Somente escrituração", "Somente declaração", "Pagamento de tributo ou penalidade pecuniária", "Somente emissão de nota", "Somente envio de documento"], "k": 2, "e": "O CTN art. 113 §1º inclui pagamento de tributo ou penalidade pecuniária na obrigação principal. A redação original omitia as penalidades."}, {"n": 179, "q": "Obrigação tributária acessória envolve:", "a": ["Somente juros", "Somente multas", "Prestações positivas ou negativas no interesse da arrecadação ou fiscalização", "Nenhum dever", "Somente pagamento"], "k": 2, "e": "Inclui emissão de documentos, escrituração, declarações e deveres de não fazer. Descumprimento pode gerar obrigação principal relativa à penalidade."}, {"n": 180, "q": "Contribuinte é sujeito passivo que:", "a": ["Fiscaliza", "Tem relação pessoal e direta com o fato gerador", "Cobra", "Paga sempre tributo alheio", "Julga"], "k": 1, "e": "O art. 121 do CTN distingue contribuinte, ligado diretamente ao fato gerador, de responsável tributário, designado por lei. Método Moreira: identifique primeiro o conceito pedido no enunciado, elimine as alternativas de categorias diferentes e confira as condições específicas antes de marcar a resposta."}];const TITLE="TRIBUTÁRIO E REVISÃO";const QUIZ="20_18";let pos=-1;let answers=JSON.parse(localStorage.getItem('moreira_'+QUIZ)||'{}');const app=document.getElementById('app');function save(){localStorage.setItem('moreira_'+QUIZ,JSON.stringify(answers))}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:240;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}function pick(i){let q=DATA[pos];if(answers[q.n]!=null)return;answers[q.n]=i;save();sound(i===q.k);render();app.classList.add('flash');if(i!==q.k)app.classList.add('bad');setTimeout(()=>app.classList.remove('flash','bad'),900)}function reset(){if(confirm('Reiniciar as respostas deste quiz?')){answers={};save();pos=-1;render()}}function nav(d){pos=Math.max(-1,Math.min(DATA.length,pos+d));render();window.scrollTo(0,0)}function render(){let done=DATA.filter(q=>answers[q.n]!=null).length,correct=DATA.filter(q=>answers[q.n]===q.k).length;let out='<div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="meter"><div style="width:'+done/DATA.length*100+'%"></div></div>';if(pos===-1){out+='<section class="panel cover"><div class="eyebrow">TREINAMENTO PESADO • QUIZ '+QUIZ.split('_').pop()+'</div><h1>'+TITLE+'</h1><h2>'+DATA.length+' QUESTÕES COM RESOLUÇÃO APROFUNDADA</h2><p>💙 Aprenda com cada questão. Quem estuda, evolui!</p><button class="go" onclick="nav(1)">COMEÇAR ▶</button><p class="small">Respostas salvas neste navegador.</p></section>'}else if(pos===DATA.length){let pct=Math.round(correct/DATA.length*100);out+='<section class="panel cover"><h1>🏆 RESULTADO FINAL</h1><div class="score">'+correct+' / '+DATA.length+'</div><h2>'+pct+'% de acertos</h2><p>'+(pct===100?'Excelente! Você dominou este bloco!':pct>=70?'Muito bem! Revise as questões erradas e avance.':'Continue treinando: cada erro revela um ponto para fortalecer.')+'</p><button class="go" onclick="nav(-1)">◀ REVISAR</button><button class="go" onclick="reset()">↻ REINICIAR</button></section>'}else{let q=DATA[pos],selected=answers[q.n],answered=selected!=null;out+='<section class="panel"><div class="eyebrow">QUESTÃO '+q.n+' • '+(pos+1)+' DE '+DATA.length+' • '+correct+' ACERTOS</div><div class="question">'+q.q+'</div>'+q.a.map((v,i)=>'<button class="choice '+(answered?(i===q.k?'correct':i===selected?'wrong':''):'')+'" '+(answered?'disabled':'')+' onclick="pick('+i+')"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('');if(answered){out+='<div class="explain"><strong>📘 RESOLUÇÃO COMENTADA — GABARITO '+String.fromCharCode(65+q.k)+'</strong><p>'+q.e+'</p><strong>'+(selected===q.k?'✅ Muito bem! Você está no caminho da aprovação!':'💪 Errar faz parte do aprendizado. Entenda a explicação e siga em frente!')+'</strong></div>'}out+='</section>'}out+='<div class="controls"><button onclick="nav(-1)" '+(pos===-1?'disabled':'')+'>◀ VOLTAR</button><button onclick="nav(1)" '+(pos===DATA.length?'disabled':'')+'>AVANÇAR ▶</button><button onclick="reset()">↻ REINICIAR</button></div><a class="toplink" href="index.html">⌂ VOLTAR AO MENU DOS 25 QUIZZES</a>';app.innerHTML=out}render();</script></body></html>
